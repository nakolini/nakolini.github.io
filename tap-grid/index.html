<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Grid — Arcade Reaction Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='30' cy='30' r='12' fill='%23555'/><circle cx='50' cy='30' r='12' fill='%23ffdd00'/><circle cx='70' cy='30' r='12' fill='%23555'/><circle cx='30' cy='55' r='12' fill='%23555'/><circle cx='50' cy='55' r='12' fill='%23555'/><circle cx='70' cy='55' r='12' fill='%23555'/><circle cx='30' cy='80' r='12' fill='%23555'/><circle cx='50' cy='80' r='12' fill='%23555'/><circle cx='70' cy='80' r='12' fill='%23555'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 20px);
            gap: 8px;
            margin-bottom: 1.5rem;
        }
        .btn {
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
        }
        .btn.active {
            background: radial-gradient(circle, #ffee55, #cc8800);
            box-shadow: 0 0 12px rgba(255,221,0,0.5);
            border-color: rgba(255,221,0,0.4);
        }
        .logo { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .tagline { font-size: 1.1rem; color: rgba(255,255,255,0.3); margin-bottom: 2rem; }
        nav { display: flex; gap: 1.5rem; margin-top: 2rem; }
        nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        nav a:hover { color: #ffdd00; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="btn"></div><div class="btn active"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
        <div class="btn"></div><div class="btn"></div><div class="btn"></div>
    </div>
    <div class="logo">Tap Grid</div>
    <p class="tagline">Tap fast. Beat your score.</p>
    <nav>
        <a href="support.html">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
    </nav>
</body>
</html>
