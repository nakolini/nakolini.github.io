<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nakolini — iPhone apps</title>
  <meta name="description" content="Small iPhone apps by Nakolini: Anonimo Face Blur, Prospekt, Less or More, Tap Grid and Red Dot.">
  <link rel="canonical" href="https://nakolini.github.io/">
  <meta property="og:site_name" content="Nakolini">
  <meta property="og:title" content="Nakolini — iPhone apps">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nakolini.github.io/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Nakolini",
    "url": "https://nakolini.github.io/"
  }
  </script>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --card: #fff; --line: #e5e5e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #f2f2f2; --muted: #999; --card: #1b1b1b; --line: #2c2c2c; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 32px; }
    p.lead { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.app { display: block; padding: 16px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
    a.app:hover { border-color: var(--muted); }
    a.app strong { display: block; font-size: 19px; }
    a.app span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Nakolini</h1>
    <p class="lead">Small iPhone apps that do one thing well.</p>
    <ul>
      <li><a class="app" href="anonimo/"><strong>Anonimo Face Blur</strong><span>Offline face blur and emoji covers for iPhone video</span></a></li>
      <li><a class="app" href="prospekt-site/"><strong>Prospekt</strong><span>Camera lens simulator</span></a></li>
      <li><a class="app" href="less-or-more/"><strong>Less or More</strong><span>Mental math against the clock</span></a></li>
      <li><a class="app" href="tap-grid/"><strong>Tap Grid</strong><span>Arcade reaction game</span></a></li>
      <li><a class="app" href="red-dot/"><strong>Red Dot</strong><span>Reaction game</span></a></li>
    </ul>
  </main>
</body>
</html>
