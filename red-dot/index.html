<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Dot — Reaction Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff3b30'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .dot {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff3b30, #b30000);
            box-shadow: 0 0 30px rgba(255, 59, 48, 0.4), 0 0 60px rgba(255, 59, 48, 0.15);
            margin-bottom: 1.5rem;
        }
        .logo { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .tagline { font-size: 1.1rem; color: rgba(255,255,255,0.3); margin-bottom: 2rem; }
        nav { display: flex; gap: 1.5rem; margin-top: 2rem; }
        nav a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        nav a:hover { color: #ff3b30; }
    </style>
</head>
<body>
    <div class="dot"></div>
    <div class="logo">Red Dot</div>
    <p class="tagline">Try to catch.</p>
    <nav>
        <a href="support.html">Support</a>
        <a href="privacy-policy.html">Privacy Policy</a>
    </nav>
</body>
</html>
